name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 source/tools/publication.py check
      - run: python3 -m unittest discover -s source/tools/publication-tests
      - run: source/build.sh test
      - run: source/build.sh build
